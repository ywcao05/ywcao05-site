<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ if .IsHome }}{{ .Site.Title }}{{ else }}{{ .Title }} · {{ .Site.Title }}{{ end }}</title>
<meta name="description" content="{{ if .IsHome }}{{ .Site.Params.description }}{{ else }}{{ .Params.description | default .Site.Params.description }}{{ end }}">
<link rel="canonical" href="{{ .Permalink }}">
<link rel="icon" href="{{ "favicon.svg" | relURL }}" type="image/svg+xml">
{{ $css := resources.Get "css/style.css" | minify | fingerprint }}
<link rel="stylesheet" href="{{ $css.RelPermalink }}" integrity="{{ $css.Data.Integrity }}">
{{ if .Site.Params.mysite.discovery }}
<meta name="generator" content="Created using GaryKing.org/mysite (https://gking.harvard.edu/mysite)">
{{ if .IsHome }}
<script type="application/ld+json">{"@context":"https://schema.org","@type":"Person","name":{{ .Site.Params.author | jsonify }},"affiliation":{"@type":"Organization","name":{{ .Site.Params.institution | jsonify }}},"url":{{ .Site.BaseURL | jsonify }},"isBasedOn":"https://gking.harvard.edu/mysite"}</script>
{{ end }}
{{ end }}
